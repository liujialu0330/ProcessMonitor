[pytest]
testpaths = tests
# 默认（本地快速集）排除性能基准、加速浸泡与慢用例：perf / soak 耗时且依赖机器，slow 是真实
# 进程 / 真实管道 / 全链路冒烟这类单独跑也超过 2 秒、已有快速替身覆盖的用例。
# 命令行再给 -m 会覆盖这里的默认值：CI 完整集用 -m "not perf and not soak and not gui_real"
# （含 slow）；只看慢用例用 -m slow
addopts = -m "not perf and not soak and not slow"
markers =
    perf: 性能基准（tests/perf/，与 budgets.json 预算比较），默认排除
    soak: 加速浸泡（假时钟模拟长时间运行），默认排除
    slow: 慢用例（真实进程 / 真实管道 / 全链路冒烟 / 大数据对拍），本地默认排除、CI 完整集运行；每个都有快速替身用例覆盖同一逻辑
    gui_real: 需要真实窗口（非 offscreen）的界面用例
    real_exit_probe: 需要对真实进程取退出码句柄（保留真实 open_exit_probe，不换成空探针）
